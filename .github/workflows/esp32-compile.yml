name: Compile ESP32 firmwares
on:
  push:
    branches: [main]
    paths:
      - 'esp32/iotmotor_esp32/iotmotor_esp32_comandos/**'
      - 'esp32/iotmotor_esp32/iotmotor_esp32_s3_sensores/**'
      - '.github/workflows/esp32-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 board core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.2.1 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install firmware libraries
        run: |
          arduino-cli lib install 'PZEM004Tv30@1.2.1' 'LiquidCrystal I2C' 'PubSubClient' 'ArduinoJson@6.21.5' 'OneWire' 'DallasTemperature' 'WiFiManager@2.0.17'
      - name: Configure command password
        # A senha nao fica no repositorio: vem do segredo IOTMOTOR_CMD_SENHA e
        # e escrita em comando_local.h so durante o build. Sem o segredo, o
        # firmware sai aceitando comando aberto, como antes.
        env:
          IOTMOTOR_CMD_SENHA: ${{ secrets.IOTMOTOR_CMD_SENHA }}
        run: |
          if [ -n "$IOTMOTOR_CMD_SENHA" ]; then
            for pasta in esp32/iotmotor_esp32/iotmotor_esp32_comandos esp32/iotmotor_esp32/iotmotor_esp32_s3_sensores; do
              {
                echo '#pragma once'
                echo "#define COMANDO_SENHA \"$IOTMOTOR_CMD_SENHA\""
              } > "$pasta/comando_local.h"
            done
            echo "Firmware vai exigir comandos cifrados."
          else
            echo "::warning::Sem o segredo IOTMOTOR_CMD_SENHA: o firmware aceita comandos abertos no broker publico."
          fi
      - name: Compile four-relay ESP32 firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs esp32/iotmotor_esp32/iotmotor_esp32_comandos
      - name: Compile ESP32-S3 sensor firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:PartitionScheme=min_spiffs esp32/iotmotor_esp32/iotmotor_esp32_s3_sensores
