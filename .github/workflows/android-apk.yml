name: Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  # Na PR: testes e build, sem publicar no app-latest.
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

# Evita que dois pushes próximos publiquem APKs fora de ordem no release
# app-latest. Só o build mais recente da mesma referência pode continuar.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publica o APK no release app-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Chave de publicacao fixa (segredos do repositorio). Sem ela cada build
      # teria outra assinatura e o Android exigiria desinstalar para atualizar,
      # entao o workflow para aqui em vez de publicar um APK incompativel.
      - name: Restore release signing key
        id: chave
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            # PR de fork ou do Dependabot nao recebe segredos: testa e compila
            # com a chave de debug (nada e publicado a partir de PR).
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::PR sem os segredos de assinatura: build com a chave de debug."
              echo "assinado=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Segredos ANDROID_KEYSTORE_* ausentes: o APK sairia com assinatura diferente."
            exit 1
          fi
          echo "assinado=true" >> "$GITHUB_OUTPUT"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/iotmotor-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/iotmotor-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Version and name of this app build
        # Cada atualizacao do app tem numero (pubspec.yaml) e nome
        # (lib/app/versao.dart). Na PR que muda o app, o numero tem de subir.
        run: |
          VERSAO="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          NOME="$(sed -n "s/^const String nomeDaVersao = '\(.*\)';$/\1/p" lib/app/versao.dart)"
          if [ -z "$VERSAO" ] || [ -z "$NOME" ]; then
            echo "::error::Versao ($VERSAO) ou nome ($NOME) ausente: confira pubspec.yaml e lib/app/versao.dart."
            exit 1
          fi
          echo "VERSAO_APP=$VERSAO" >> "$GITHUB_ENV"
          echo "NOME_APP=$NOME" >> "$GITHUB_ENV"
          echo "Versao do app: $VERSAO — $NOME"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q --depth=1 origin "${{ github.base_ref }}"
            BASE="$(git show FETCH_HEAD:pubspec.yaml | grep '^version:' | awk '{print $2}' | cut -d+ -f1)"
            MAIOR="$(printf '%s\n%s\n' "$BASE" "$VERSAO" | sort -V | tail -1)"
            if [ "$VERSAO" = "$BASE" ] || [ "$MAIOR" != "$VERSAO" ]; then
              echo "::error::Esta PR muda o app: suba o version do pubspec.yaml (hoje $VERSAO, main $BASE) e troque o nomeDaVersao em lib/app/versao.dart."
              exit 1
            fi
          fi
      - name: Run app tests
        # Sem isto o APK sairia compilando mesmo com teste quebrado.
        run: flutter test
      - name: Build Android APK
        # O selo do build vai dentro do APK e no app-latest.json: e assim que o
        # app sabe se ha versao mais nova, ja que a versao do pubspec nao muda.
        # O build-number (versionCode) cresce a cada build: o Android recusa
        # instalar uma versao "menor" por cima da instalada.
        # So ARM (32 e 64 bits), que cobre os celulares: sem o x86_64, que so
        # serve a emuladores, o APK fica cerca de um terco menor.
        run: |
          SELO="$(date -u '+%Y%m%d%H%M')"
          echo "IOTMOTOR_BUILD=$SELO" >> "$GITHUB_ENV"
          flutter build apk --release --build-number="$(date -u '+%y%m%d%H')" \
            --target-platform android-arm,android-arm64 \
            --dart-define=IOTMOTOR_BUILD="$SELO"
      - name: Check APK signature
        if: steps.chave.outputs.assinado == 'true'
        # O APK usa so assinatura v2/v3 (keytool -jarfile nao le): apksigner.
        # Deve mostrar CN=IoTMotor; qualquer outra chave impede atualizar.
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certificado.txt
          if ! grep -q "CN=IoTMotor" certificado.txt; then
            echo "::error::APK nao esta assinado com a chave de publicacao IoTMotor."
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: IoTMotor-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      # O app confere app-latest.json e baixa o APK deste release, sem cabo.
      - name: Publish APK for in-app update
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/IoTMotor.apk
          VERSAO="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          cat > dist/app-latest.json <<JSON
          {
            "version": "${VERSAO}",
            "name": "${NOME_APP}",
            "build": "${IOTMOTOR_BUILD}",
            "commit": "${GITHUB_SHA::7}",
            "apk": "https://github.com/${GITHUB_REPOSITORY}/releases/download/app-latest/IoTMotor.apk"
          }
          JSON
          cat dist/app-latest.json
          gh release view app-latest >/dev/null 2>&1 ||
            gh release create app-latest --title 'App Android (ultimo build da main)' \
              --notes 'APK atualizado automaticamente a cada commit na main. Usado pela verificacao de atualizacao dentro do app.'
          gh release upload app-latest dist/IoTMotor.apk dist/app-latest.json --clobber
          gh release edit app-latest --notes "IoTMotor ${VERSAO_APP} — ${NOME_APP}. Build de ${GITHUB_SHA::7} em $(date -u '+%Y-%m-%d %H:%M UTC')."
          # Release com nome para cada versao (historico de versoes do app).
          TAG="app-v${VERSAO_APP}"
          TITULO="IoTMotor ${VERSAO_APP} — ${NOME_APP}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/IoTMotor.apk --clobber
            gh release edit "$TAG" --title "$TITULO"
          else
            gh release create "$TAG" dist/IoTMotor.apk --target "$GITHUB_SHA" --title "$TITULO" \
              --notes "Versao ${VERSAO_APP} do app Android: ${NOME_APP}. Build de ${GITHUB_SHA::7}. Para atualizar pelo proprio app, use Configuracoes > Atualizar este app."
          fi
