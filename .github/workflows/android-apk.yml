name: Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publica o APK no release app-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Chave de publicacao fixa (segredos do repositorio). Sem ela cada build
      # teria outra assinatura e o Android exigiria desinstalar para atualizar,
      # entao o workflow para aqui em vez de publicar um APK incompativel.
      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Segredos ANDROID_KEYSTORE_* ausentes: o APK sairia com assinatura diferente."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/iotmotor-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/iotmotor-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Build Android APK
        # O selo do build vai dentro do APK e no app-latest.json: e assim que o
        # app sabe se ha versao mais nova, ja que a versao do pubspec nao muda.
        # O build-number (versionCode) cresce a cada build: o Android recusa
        # instalar uma versao "menor" por cima da instalada.
        run: |
          SELO="$(date -u '+%Y%m%d%H%M')"
          echo "IOTMOTOR_BUILD=$SELO" >> "$GITHUB_ENV"
          flutter build apk --release --build-number="$(date -u '+%y%m%d%H')" \
            --dart-define=IOTMOTOR_BUILD="$SELO"
      - name: Check APK signature
        # Deve mostrar CN=IoTMotor; "Android Debug" indicaria a chave errada.
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | tee certificado.txt | grep -E "Owner:|SHA256:"
          if grep -q "Android Debug" certificado.txt; then
            echo "::error::APK assinado com a chave de depuracao."
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IoTMotor-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      # O app confere app-latest.json e baixa o APK deste release, sem cabo.
      - name: Publish APK for in-app update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/IoTMotor.apk
          VERSAO="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          cat > dist/app-latest.json <<JSON
          {
            "version": "${VERSAO}",
            "build": "${IOTMOTOR_BUILD}",
            "commit": "${GITHUB_SHA::7}",
            "apk": "https://github.com/${GITHUB_REPOSITORY}/releases/download/app-latest/IoTMotor.apk"
          }
          JSON
          cat dist/app-latest.json
          gh release view app-latest >/dev/null 2>&1 ||
            gh release create app-latest --title 'App Android (ultimo build da main)' \
              --notes 'APK atualizado automaticamente a cada commit na main. Usado pela verificacao de atualizacao dentro do app.'
          gh release upload app-latest dist/IoTMotor.apk dist/app-latest.json --clobber
          gh release edit app-latest --notes "Build de ${GITHUB_SHA::7} em $(date -u '+%Y-%m-%d %H:%M UTC')."
