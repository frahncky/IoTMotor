name: Firmware

on:
  push:
    # So o branch padrao: num branch de PR o gatilho pull_request ja cobre, e
    # os dois juntos disparavam o mesmo job duas vezes por push.
    branches: [main]
    paths:
      - 'esp32/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'esp32/**'
      - '.github/workflows/firmware.yml'
  # Uma tag v* compila e publica os binarios como release.
  create:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compila os dois modulos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Instala o arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Instala o core do ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      # Nomes conforme o indice oficial (o `name=` do library.properties de
      # cada repositorio registrado), nao o rotulo mostrado na IDE.
      #
      # ArduinoJson fica preso na 6.x de proposito: a 7 removeu
      # StaticJsonDocument, createNestedArray e containsKey, que este firmware
      # usa. Subir de major exige reescrever o codigo de serializacao.
      - name: Instala as bibliotecas
        run: |
          arduino-cli lib install \
            "PubSubClient" \
            "ArduinoJson@6.21.5" \
            "PZEM004Tv30" \
            "LiquidCrystal_I2C" \
            "OneWire" \
            "DallasTemperature"

      # PartitionScheme=custom faz o core usar o partitions.csv da pasta do
      # sketch — as tabelas de dois slots versionadas neste repositorio.
      - name: Compila o Modulo 1 (ESP32, 4 MB)
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=custom,FlashSize=4M" \
            --libraries esp32/libraries \
            --output-dir build/modulo1 \
            esp32/iotmotor_modulo1_acionamento

      - name: Compila o Modulo 2 (ESP32-S3 N8R2)
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PartitionScheme=custom,FlashSize=8M,PSRAM=enabled" \
            --libraries esp32/libraries \
            --output-dir build/modulo2 \
            esp32/iotmotor_modulo2_sensores

      # O tamanho do binario contra o slot de OTA e o numero que importa:
      # a imagem precisa caber em UM slot, nao na flash inteira.
      - name: Confere o tamanho contra o slot de OTA
        run: |
          python3 - <<'PY'
          import pathlib, sys

          # (binario, tabela de particao, rotulo)
          alvos = [
              ("build/modulo1/iotmotor_modulo1_acionamento.ino.bin",
               "esp32/iotmotor_modulo1_acionamento/partitions.csv", "Modulo 1"),
              ("build/modulo2/iotmotor_modulo2_sensores.ino.bin",
               "esp32/iotmotor_modulo2_sensores/partitions.csv", "Modulo 2"),
          ]

          falhou = False
          for caminho, tabela, rotulo in alvos:
              binario = pathlib.Path(caminho)
              if not binario.exists():
                  print(f"{rotulo}: binario nao encontrado em {caminho}")
                  falhou = True
                  continue

              slot = 0
              for linha in open(tabela):
                  if linha.strip().startswith("app0"):
                      slot = int(linha.split(",")[4].strip(), 16)

              tamanho = binario.stat().st_size
              uso = tamanho * 100 / slot
              print(f"{rotulo}: {tamanho:,} bytes de {slot:,} no slot ({uso:.1f}%)")
              if tamanho > slot:
                  print(f"  ERRO: nao cabe no slot de OTA.")
                  falhou = True
              elif uso > 85:
                  print(f"  AVISO: acima de 85% do slot.")

          sys.exit(1 if falhou else 0)
          PY

      # O portao de verdade e a compilacao com a conferencia de tamanho acima;
      # este passo e conveniencia. Sobe so as imagens de aplicacao (o `*.bin`
      # anterior levava tambem bootloader, tabela e .elf, oito arquivos) e nao
      # derruba o job: a cota de artefato e da conta, nao um defeito do codigo.
      - name: Publica os binarios como artefato
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: iotmotor-firmware
          path: |
            build/modulo1/iotmotor_modulo1_acionamento.ino.bin
            build/modulo2/iotmotor_modulo2_sensores.ino.bin
          retention-days: 14
          if-no-files-found: error

      - name: Anexa os binarios ao release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/modulo1/*.bin
            build/modulo2/*.bin
