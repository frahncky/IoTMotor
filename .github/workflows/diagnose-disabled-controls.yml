name: Explain disabled MQTT controls
on:
  push:
    branches: [main]
    paths:
      - tools/diagnose_disabled_buttons.py
      - .github/workflows/diagnose-disabled-controls.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update control diagnostics and embedded site
        run: |
          python3 -m py_compile tools/diagnose_disabled_buttons.py tools/rebuild_esp32_site.py
          python3 tools/diagnose_disabled_buttons.py
          python3 tools/rebuild_esp32_site.py
      - name: Verify interface and firmware assets
        run: |
          node --check dashboard-cloudflare/remote-controls.js
          node --check dashboard-cloudflare/local-controls.js
          node --check dashboard-cloudflare/dual-dashboard.js
          node --test dashboard-cloudflare/dual-dashboard.test.cjs dashboard-cloudflare/hardware-mirror.test.cjs
          grep -q 'function blockedReason()' dashboard-cloudflare/remote-controls.js
          grep -q 'CONTROLE MQTT REMOTO' dashboard-cloudflare/index.html
          grep -q 'IOTMOTOR_REMOTE_JS' esp32/iotmotor_esp32/iotmotor_esp32_comandos/iotmotor_site.h
          git diff --check
      - name: Commit verified diagnostics
        run: |
          if ! git diff --quiet -- dashboard-cloudflare/remote-controls.js dashboard-cloudflare/index.html esp32/iotmotor_esp32/iotmotor_esp32_comandos/iotmotor_site.h; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add dashboard-cloudflare/remote-controls.js dashboard-cloudflare/index.html esp32/iotmotor_esp32/iotmotor_esp32_comandos/iotmotor_site.h
            git commit -m 'fix(web): explain missing firmware, MQTT, key and jumper on disabled buttons'
            git push origin HEAD:main
          fi
