name: Cloudflare dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard-cloudflare/**'
      - '.github/workflows/cloudflare-dashboard.yml'
  pull_request:
    paths:
      - 'dashboard-cloudflare/**'
      - '.github/workflows/cloudflare-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check dashboard-cloudflare/app.js
          node --check dashboard-cloudflare/dual-dashboard.js
          node --check dashboard-cloudflare/hardware-mirror.js
      - name: Run dashboard tests
        run: node --test dashboard-cloudflare/app.test.cjs dashboard-cloudflare/dual-dashboard.test.cjs dashboard-cloudflare/hardware-mirror.test.cjs
      - name: Check static site files
        run: |
          test -s dashboard-cloudflare/index.html
          test -s dashboard-cloudflare/hardware.html
          test -s dashboard-cloudflare/_headers
          grep -q 'dual-dashboard.js' dashboard-cloudflare/index.html
          grep -q 'hardware-mirror.js' dashboard-cloudflare/hardware.html
