name: IoTMotor web and firmware checks
on:
  push:
    branches: [main]
    paths:
      - 'dashboard-cloudflare/**'
      - 'esp32/**'
      - '.github/workflows/cloudflare-dashboard.yml'
  pull_request:
    paths:
      - 'dashboard-cloudflare/**'
      - 'esp32/**'
      - '.github/workflows/cloudflare-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check dashboard-cloudflare/dual-dashboard.js
          node --check dashboard-cloudflare/local-controls.js
          node --check dashboard-cloudflare/remote-controls.js
          node --check dashboard-cloudflare/hardware-mirror.js
          node --check dashboard-cloudflare/wifi-manager.js
          node --check dashboard-cloudflare/alarm-controls.js
          node --check dashboard-cloudflare/command-seal.js
      - name: Run web tests
        run: node --test dashboard-cloudflare/dual-dashboard.test.cjs dashboard-cloudflare/hardware-mirror.test.cjs dashboard-cloudflare/wifi-manager.test.cjs dashboard-cloudflare/alarm-controls.test.cjs dashboard-cloudflare/command-seal.test.cjs
      - name: Verify MQTT-only firmware and controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('esp32/iotmotor_esp32/iotmotor_esp32_comandos')
          firmware = (root / 'iotmotor_esp32_comandos.ino').read_text()
          control = (root / 'iotmotor_mqtt_control.h').read_text()
          profile = (root / 'iotmotor_profiles.h').read_text()
          remote = Path('dashboard-cloudflare/remote-controls.js').read_text()
          local = Path('dashboard-cloudflare/local-controls.js').read_text()
          page = Path('dashboard-cloudflare/index.html').read_text()
          assert 'mqttClient.subscribe(topicoComandos, 1)' in firmware
          assert 'relay_pins' in firmware and 'createNestedArray("lcd")' in firmware
          assert 'WebServer' not in firmware and 'server.on(' not in firmware and 'iotmotor_site.h' not in firmware
          assert not (root / 'iotmotor_site.h').exists()
          assert 'mbedtls' not in control and 'Preferences' not in control and 'cmd_key' not in control
          assert 'mqttControlKey' not in remote and 'crypto.subtle' not in remote
          assert 'startBtn' in page and 'stopBtn' in page
          assert "start.addEventListener('click'" in remote and "stop.addEventListener('click'" in remote
          assert "fetch('/dados'" not in local and 'server.on(' not in control
          assert 'PINO_HABILITACAO_BANCADA' not in firmware
          assert 'PINO_HABILITACAO_BANCADA' not in profile
          assert 'bancadaHabilitada()' not in control
          assert 'if (!armed)' not in remote
          assert 'doc["requires_gpio32_arm"] = false;' in firmware
          assert 'LIMITE_BANCADA_MS = 300000UL' in profile
          ws = (root / 'mqtt_websocket_client.h').read_text()
          assert ws == Path('esp32/iotmotor_esp32/iotmotor_esp32_s3_sensores/mqtt_websocket_client.h').read_text(), 'adaptador WebSocket diferente entre os firmwares'
          assert 'MqttWebSocketClient mqttTransport;' in firmware and 'MQTT_PORT = 8080' in firmware
          ota = (root / 'ota_update.h').read_text()
          assert ota == Path('esp32/iotmotor_esp32/iotmotor_esp32_s3_sensores/ota_update.h').read_text(), 'ota_update.h diferente entre os firmwares'
          assert 'OTA_BASE_URL' in ota and 'doc["url"]' not in control, 'a URL do OTA deve ser fixa no firmware'
          s3 = Path('esp32/iotmotor_esp32/iotmotor_esp32_s3_sensores')
          for nome in ('wifi_store.h', 'wifi_portal.h'):
              assert (root / nome).read_text() == (s3 / nome).read_text(), nome + ' diferente entre os firmwares'
          assert 'iotmotor-wifi-v1' in (root / 'wifi_store.h').read_text() and 'iotmotor-wifi-v1' in Path('dashboard-cloudflare/wifi-manager.js').read_text(), 'rotulo da cifragem divergente'
          # Lista de alarmes: a placa guarda, o painel edita, o S3 ouve o quadro.
          sensores = (s3 / 'iotmotor_esp32_s3_sensores.ino').read_text()
          lista = (s3 / 'alarm_list.h').read_text()
          alarme_js = Path('dashboard-cloudflare/alarm-controls.js').read_text()
          assert 'mqtt.subscribe(quadroTelemetryTopic,0)' in sensores, 'o S3 precisa ouvir a telemetria do quadro para alarmes eletricos'
          for acao in ('alarm_list', 'alarm_save', 'alarm_remove'):
              assert acao in sensores and acao in alarme_js, acao + ' ausente no firmware ou no painel'
          assert 'alarms_firing' in sensores and 'alarms_firing' in alarme_js
          assert 'alarmeLista' in page and 'alarmeAddForm' in page
          for campo in ('voltage', 'current', 'power', 'frequency', 'pf'):
              assert '"%s"' % campo in firmware, 'o painel oferece ' + campo + ', que o quadro nao publica'
          assert 'MAX_ALARMES = 8' in lista, 'o painel conta com oito alarmes na placa'
          # Comandos cifrados: firmware, painel e app precisam da mesma conta.
          seguro = (root / 'comando_seguro.h').read_text()
          assert seguro == (s3 / 'comando_seguro.h').read_text(), 'comando_seguro.h diferente entre os firmwares'
          selo_js = Path('dashboard-cloudflare/command-seal.js').read_text()
          selo_dart = Path('lib/features/iot_motor/services/command_seal.dart').read_text()
          for texto, onde in ((seguro, 'firmware'), (selo_js, 'painel'), (selo_dart, 'app')):
              assert 'iotmotor-cmd-v1' in texto, 'rotulo do selo divergente no ' + onde
          # O campo 'sealed' e lido nos dois firmwares e montado nos dois clientes.
          for texto, onde in ((control, 'quadro'), (sensores, 'sensores'), (selo_js, 'painel'), (selo_dart, 'app')):
              assert 'sealed' in texto, 'campo sealed ausente no ' + onde
          assert 'troque-por-uma-senha-longa' in (root / 'comando_local.exemplo.h').read_text(), 'o modelo versionado nao pode carregar senha real'
          for pasta in (root, s3):
              assert not (pasta / 'comando_local.h').exists(), 'comando_local.h nao pode ir para o Git'
          PY
