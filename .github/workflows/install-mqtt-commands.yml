name: Install signed MQTT control
on:
  push:
    branches: [main]
    paths:
      - 'tools/install_mqtt_commands.py'
      - '.github/workflows/install-mqtt-commands.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and synchronize signed MQTT control
        run: |
          python3 -m py_compile tools/install_mqtt_commands.py tools/rebuild_esp32_site.py
          python3 tools/install_mqtt_commands.py
          python3 tools/rebuild_esp32_site.py
      - name: Verify browser scripts and test suite
        run: |
          node --check dashboard-cloudflare/dual-dashboard.js
          node --check dashboard-cloudflare/local-controls.js
          node --check dashboard-cloudflare/remote-controls.js
          node --test dashboard-cloudflare/dual-dashboard.test.cjs dashboard-cloudflare/hardware-mirror.test.cjs
          grep -q 'mqttClient.setCallback(receberComandoMqtt)' esp32/iotmotor_esp32/iotmotor_esp32_comandos/iotmotor_esp32_comandos.ino
          grep -q 'mqttClient.subscribe(topicoComandos, 1)' esp32/iotmotor_esp32/iotmotor_esp32_comandos/iotmotor_esp32_comandos.ino
          grep -q 'mbedtls_md_hmac' esp32/iotmotor_esp32/iotmotor_esp32_comandos/iotmotor_mqtt_control.h
          grep -q 'IOTMOTOR_REMOTE_JS' esp32/iotmotor_esp32/iotmotor_esp32_comandos/iotmotor_site.h
          grep -q 'remote-controls.js' dashboard-cloudflare/index.html
          ! grep -q 'localStorage.*mqttControlKey' dashboard-cloudflare/remote-controls.js
          git diff --check
      - name: Commit tested dashboard and ESP32 firmware
        run: |
          if ! git diff --quiet -- esp32/iotmotor_esp32/iotmotor_esp32_comandos dashboard-cloudflare/index.html tools/rebuild_esp32_site.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add esp32/iotmotor_esp32/iotmotor_esp32_comandos dashboard-cloudflare/index.html tools/rebuild_esp32_site.py
            git commit -m 'feat(iotmotor): operate existing on-off buttons over signed MQTT'
            git push origin HEAD:main
          fi
