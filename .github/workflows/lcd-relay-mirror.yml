name: LCD and relay mirror firmware

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_hardware_mirror.py'
      - '.github/workflows/lcd-relay-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch original four-relay firmware
        run: git fetch --no-tags origin 'refs/heads/claude/focused-ptolemy-o0h29l:refs/remotes/origin/claude/focused-ptolemy-o0h29l'
      - name: Create LCD and relay monitoring variant
        run: |
          python3 -m py_compile tools/generate_hardware_mirror.py
          python3 tools/generate_hardware_mirror.py --output dist/iotmotor_esp32_comandos_4reles/iotmotor_esp32_comandos_4reles.ino
          grep -q 'createNestedArray("lcd")' dist/iotmotor_esp32_comandos_4reles/iotmotor_esp32_comandos_4reles.ino
          grep -q 'createNestedArray("relays")' dist/iotmotor_esp32_comandos_4reles/iotmotor_esp32_comandos_4reles.ino
          if grep -q 'linguagemC' dist/iotmotor_esp32_comandos_4reles/iotmotor_esp32_comandos_4reles.ino; then echo 'Wi-Fi credential unexpectedly present'; exit 1; fi
      - name: Package project-specific networking library
        run: |
          git archive origin/claude/focused-ptolemy-o0h29l esp32/libraries/IoTMotorNet | tar -x
          mkdir -p dist/libraries
          cp -R esp32/libraries/IoTMotorNet dist/libraries/IoTMotorNet
      - uses: actions/upload-artifact@v4
        with:
          name: IoTMotor-4reles-LCD-espelho
          path: dist/
          retention-days: 14
