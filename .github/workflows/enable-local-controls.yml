name: Expose local ESP32 controls

on:
  push:
    branches: [main]
    paths:
      - 'tools/enable_local_controls.py'
      - '.github/workflows/enable-local-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add LAN control-panel access to main dashboard
        run: python3 tools/enable_local_controls.py
      - name: Verify scripts and dashboard integration
        run: |
          node --check dashboard-cloudflare/local-controls.js
          node --check dashboard-cloudflare/dual-dashboard.js
          grep -q 'local-controls.js' dashboard-cloudflare/index.html
          ! grep -q 'mqtt\.publish' dashboard-cloudflare/local-controls.js
      - name: Commit consolidated dashboard entry
        run: |
          if ! git diff --quiet -- dashboard-cloudflare/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add dashboard-cloudflare/index.html
            git commit -m 'feat(web): link existing LAN on/off controls from dashboard'
            git push origin HEAD:main
          fi
