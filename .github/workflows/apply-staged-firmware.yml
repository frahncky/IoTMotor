name: Install canonical ESP32 firmware
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-staged-firmware.yml]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and check source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          data=gzip.decompress(base64.b64decode(Path('tools/consolidated_esp32_payload.b64').read_text().strip())).decode('utf-8')
          assert 'PINOS_RELES[NUM_RELES] = {19, 18, 23, 27}' in data
          assert 'createNestedArray("lcd")' in data
          assert 'const char* WIFI_PASSWORD = "";' in data
          p=Path('esp32/iotmotor_esp32/iotmotor_esp32_comandos/iotmotor_esp32_comandos.ino')
          p.write_text(data)
          PY
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add esp32/iotmotor_esp32/iotmotor_esp32_comandos/iotmotor_esp32_comandos.ino
          git commit -m 'feat: set tested v6 four-relay LCD firmware as primary ESP32 source'
          git push origin HEAD:main
