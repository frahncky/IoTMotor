name: Inspect staged firmware
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-consolidation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged firmware and inspect metadata
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib, re
          p=pathlib.Path('tools/consolidated_esp32_payload.b64')
          data=gzip.decompress(base64.b64decode(p.read_text().strip())).decode('utf-8-sig')
          target=pathlib.Path('dist/firmware.ino'); target.parent.mkdir(exist_ok=True); target.write_text(data)
          print('Bytes:',len(data.encode()),'lines:',len(data.splitlines()))
          for key in ['#include <WiFi.h>','#include <PubSubClient.h>','#include <LiquidCrystal_I2C.h>','#include <PZEM004Tv30.h>','NUM_RELES','PINOS_RELES','mqtt.publish','mqttClient.publish','lcdCache','WebServer']:
              print(key, ':', key in data)
          print('Any nonempty WIFI_PASSWORD:',bool(re.search(r'WIFI_PASSWORD\\s*=\\s*"[^"\\n]+"',data)))
          print('Any WIFI_SSID IFMA_IOT:', 'IFMA_IOT' in data)
          print('First 8 lines:')
          print('\n'.join(data.splitlines()[:8]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staged-firmware-inspection
          path: dist/firmware.ino
          retention-days: 1
