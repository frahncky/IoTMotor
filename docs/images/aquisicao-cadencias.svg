<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 500" role="img" aria-labelledby="title desc">
<title id="title">Cadências de aquisição e publicação do IoTMotor</title>
<desc id="desc">Comparação entre aquisição de vibração, PZEM, publicação MQTT, gráfico, registro e histórico.</desc>
<rect width="1300" height="500" rx="24" fill="#f7fafc"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#153746}.h{font-size:27px;font-weight:700}.t{font-size:19px}.s{font-size:16px}.line{stroke:#547783;stroke-width:2}.tick{stroke:#547783;stroke-width:2}.fixed{fill:#dceff8;stroke:#2d6c86;stroke-width:2}.cfg{fill:#fff4d9;stroke:#b77b19;stroke-width:2}.hist{fill:#e8f5ee;stroke:#3d8062;stroke-width:2}</style>
<text x="50" y="50" class="h">Aquisição física ≠ publicação ≠ gráfico ≠ histórico</text>
<text x="230" y="95" class="s">0 s</text><text x="430" y="95" class="s">1 s</text><text x="630" y="95" class="s">2 s</text><text x="830" y="95" class="s">3 s</text><text x="1030" y="95" class="s">4 s</text><text x="1230" y="95" class="s">5 s</text>
<path d="M250 105H1245" class="line"/>
<g class="tick"><path d="M250 98v14"/><path d="M450 98v14"/><path d="M650 98v14"/><path d="M850 98v14"/><path d="M1050 98v14"/><path d="M1245 98v14"/></g>
<text x="45" y="155" class="t">Vibração</text><rect x="250" y="130" width="995" height="38" rx="10" class="fixed"/><text x="748" y="155" text-anchor="middle" class="s">1000 Hz contínuos · RMS fecha a cada 1 s</text>
<text x="45" y="220" class="t">PZEM</text><rect x="250" y="195" width="390" height="38" rx="10" class="cfg"/><rect x="650" y="195" width="390" height="38" rx="10" class="cfg"/><text x="835" y="220" text-anchor="middle" class="s">pzem_read_ms configurável</text>
<text x="45" y="285" class="t">MQTT</text><rect x="250" y="260" width="190" height="38" rx="10" class="cfg"/><rect x="650" y="260" width="190" height="38" rx="10" class="cfg"/><rect x="1050" y="260" width="190" height="38" rx="10" class="cfg"/><text x="850" y="285" text-anchor="middle" class="s">exemplo: publish_ms = 2 s</text>
<text x="45" y="350" class="t">Gráfico</text><rect x="250" y="325" width="590" height="38" rx="10" class="cfg"/><rect x="850" y="325" width="390" height="38" rx="10" class="cfg"/><text x="875" y="350" text-anchor="middle" class="s">janelas exatas definidas por chart_ms</text>
<text x="45" y="415" class="t">Histórico placa</text><rect x="250" y="390" width="995" height="38" rx="10" class="hist"/><text x="748" y="415" text-anchor="middle" class="s">consolidação por hora · retenção de 7 dias</text>
<text x="250" y="468" class="s">Escala ilustrativa: as larguras representam conceitos de cadência, não a duração real de uma hora.</text>
</svg>